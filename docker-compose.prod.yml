# Production docker-compose override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# This file enables SSL and production-grade settings

services:
  web:
    image: nginx:1.25-alpine
    container_name: finance_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./data/certbot/www:/var/www/certbot:ro
    networks:
      - finance_network
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    restart: always
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Disable nuxt dev server in production
  nuxt:
    profiles: ["dev"]
    restart: always

networks:
  finance_network:
    driver: bridge

volumes:
  finance_db_data:
    driver: local
  finance_redis_data:
    driver: local
